name: snail_sexing_app
description: "AI-powered snail sex and pregnancy classifier — live camera, on-device records."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  camera: ^0.12.0+2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  image: ^4.9.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Custom snail-shell app icon (assets/icon/) — regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#03615F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
